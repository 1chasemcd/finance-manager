name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: |
          pnpm --dir ./apps/web run build
          pnpm --dir ./apps/api wrangler deploy --dry-run --name ci

  validate-tf:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-readonly
      deployment: false

    if: github.event.pull_request.head.repo.full_name == github.repository

    outputs:
      plan_has_changes: ${{ steps.plan.outputs.plan_has_changes }}

    defaults:
      run:
        working-directory: ./infra/terraform

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Validate
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - name: Terraform Plan
        id: plan
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out "$RUNNER_TEMP/plan.tfplan"
          plan_exit=$?
          set -e
          if [ "$plan_exit" -eq 1 ]; then
            exit 1
          fi
          terraform show -no-color "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.txt"
          if [ "$plan_exit" -eq 2 ]; then
            echo "plan_has_changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "plan_has_changes=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_idp_client_id: ${{ secrets.GOOGLE_IDP_CLIENT_ID }}
          TF_VAR_google_idp_client_secret: ${{ secrets.GOOGLE_IDP_CLIENT_SECRET }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}

      - name: Build Step Summary
        if: always()
        working-directory: ./scripts
        run: ./build-tf-summary.mjs "$RUNNER_TEMP/plan.txt" >> "$GITHUB_STEP_SUMMARY"

  auto-approve:
    name: Auto Approve
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - validate-code
      - validate-tf

    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      needs.validate-tf.outputs.plan_has_changes == 'false'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Approve Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: >-
          gh pr review "$PR_NUMBER" --approve
          --body "All checks passed and the Terraform plan contains no changes."
