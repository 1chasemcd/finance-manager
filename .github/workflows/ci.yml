name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Audit Production Dependencies
        run: pnpm audit --prod

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: |
          pnpm --dir ./apps/web run build
          pnpm --dir ./apps/api wrangler deploy --env prod --dry-run --outdir "$RUNNER_TEMP/prod-bundle"
          if grep -q "createDevMiddleware" "$RUNNER_TEMP/prod-bundle/index.js"; then
            echo "::error::Development auth middleware leaked into the prod bundle"
            exit 1
          fi
