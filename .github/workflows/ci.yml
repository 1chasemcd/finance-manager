name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-code:
    name: Validate Code
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format Check
        run: pnpm run format:check

      - name: Test
        run: pnpm run test

      - name: Build
        run: |
          pnpm --dir ./apps/web run build
          pnpm --dir ./apps/api wrangler deploy --dry-run --name ci

  validate-tf:
    name: Validate Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-readonly
      deployment: false

    if: github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: ./infra/terraform

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Validate and Plan
        run: |
          terraform fmt -check -recursive
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out "$RUNNER_TEMP/plan.tfplan"
          terraform show -no-color "$RUNNER_TEMP/plan.tfplan" > "$RUNNER_TEMP/plan.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_idp_client_id: ${{ secrets.GOOGLE_IDP_CLIENT_ID }}
          TF_VAR_google_idp_client_secret: ${{ secrets.GOOGLE_IDP_CLIENT_SECRET }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}

      - name: Build Step Summary
        if: always()
        working-directory: ./scripts
        run: ./build-tf-summary.mjs "$RUNNER_TEMP/plan.txt" >> "$GITHUB_STEP_SUMMARY"
