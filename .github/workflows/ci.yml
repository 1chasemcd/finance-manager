name: CI

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Setup terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate terraform
        working-directory: ./infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: |
          pnpm --dir ./apps/web run build
          pnpm --dir ./apps/api wrangler deploy --dry-run --name ci

  tf-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-readonly
    if: github.event.pull_request.head.repo.full_name == github.repository

    defaults:
      run:
        working-directory: ./infra/terraform

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform Init and Plan
        shell: bash
        run: |
          terraform init -input=false
          terraform plan -input=false -no-color -out=tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_idp_client_id: ${{ secrets.GOOGLE_IDP_CLIENT_ID }}
          TF_VAR_google_idp_client_secret: ${{ secrets.GOOGLE_IDP_CLIENT_SECRET }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}

      - name: Show Plan
        shell: bash
        run: terraform show -no-color tfplan 2>&1 | tee "$RUNNER_TEMP/plan.txt"

      - name: Publish plan to step summary
        if: always()
        env:
          PLAN_STATUS: ${{ job.status }}
        run: |
          {
            echo "## Terraform Plan ($PLAN_STATUS)"
            echo
            echo '```terraform'
            if [ -f "$RUNNER_TEMP/plan.txt" ]; then
              cat "$RUNNER_TEMP/plan.txt"
            else
              echo "no plan output — see the workflow log for details"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
