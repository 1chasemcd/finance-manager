name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    defaults:
      run:
        working-directory: ./infra/terraform

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init and Apply
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve
          terraform output -json > "$RUNNER_TEMP/outputs.json"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_google_idp_client_id: ${{ secrets.GOOGLE_IDP_CLIENT_ID }}
          TF_VAR_google_idp_client_secret: ${{ secrets.GOOGLE_IDP_CLIENT_SECRET }}
          TF_VAR_allowed_emails: ${{ vars.ALLOWED_EMAILS }}

      - name: Build web
        working-directory: ./apps/web
        run: pnpm run build

      - name: Configure Wrangler
        working-directory: ./scripts
        run: cat $RUNNER_TEMP/outputs.json | ./configure-wrangler.mjs

      - name: Migrate db
        working-directory: ./apps/api
        run: pnpm wrangler d1 migrations apply DB --remote

      - name: Deploy Wrangler
        working-directory: ./apps/api
        run: pnpm wrangler deploy --message "Deploy #${{ github.run_number }} by ${{ github.actor }}" --tag "${{ github.sha }}"
