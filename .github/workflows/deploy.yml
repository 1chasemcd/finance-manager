name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production

    permissions:
      contents: read

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true
          require-lockfile: true

      - name: Build web
        working-directory: ./apps/web
        run: pnpm build

      - name: Migrate db
        working-directory: ./apps/api
        run: pnpm db:migrate:prod

      - name: Deploy app
        working-directory: ./apps/api
        env:
          DEPLOY_MESSAGE: "Deploy #${{ github.run_number }} by ${{ github.actor }}"
        run: |
          pnpm deploy -- --message "$DEPLOY_MESSAGE" --tag "${{ github.sha }}"
